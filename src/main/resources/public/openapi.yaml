openapi: 3.0.3
info:
  title: AEP - Sistema de Gestao de Doacoes de Alimentos
  description: API REST de doacoes e instituicoes (ODS 2 - Fome Zero).
  version: 2.0.0
servers:
  - url: /
paths:
  /doacoes:
    post:
      summary: Registrar doacao
      tags: [Doacoes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoacaoRequest'
      responses:
        '201':
          description: Doacao criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doacao'
        '400':
          description: Dados invalidos ou instituicao inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    get:
      summary: Listar doacoes
      tags: [Doacoes]
      responses:
        '200':
          description: Lista de doacoes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Doacao'
  /doacoes/{id}:
    get:
      summary: Buscar doacao por id
      tags: [Doacoes]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Doacao encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doacao'
        '404':
          description: Doacao nao encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    delete:
      summary: Remover doacao
      tags: [Doacoes]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Removida com sucesso
        '404':
          description: Doacao nao encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /doacoes/{id}/status:
    patch:
      summary: Atualizar status da doacao
      tags: [Doacoes]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusRequest'
      responses:
        '204':
          description: Status atualizado
        '400':
          description: Status invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          description: Doacao nao encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /instituicoes:
    post:
      summary: Cadastrar instituicao
      tags: [Instituicoes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstituicaoRequest'
      responses:
        '201':
          description: Instituicao criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instituicao'
        '400':
          description: Dados invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    get:
      summary: Listar instituicoes
      tags: [Instituicoes]
      responses:
        '200':
          description: Lista de instituicoes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Instituicao'
  /instituicoes/{id}/doacoes:
    get:
      summary: Listar doacoes destinadas a uma instituicao
      tags: [Instituicoes]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Doacoes da instituicao
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Doacao'
        '404':
          description: Instituicao nao encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /instituicoes/{id}:
    get:
      summary: Buscar instituicao por id
      tags: [Instituicoes]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Instituicao encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instituicao'
        '404':
          description: Instituicao nao encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    put:
      summary: Atualizar instituicao (substitui nome, endereco e contatos)
      tags: [Instituicoes]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstituicaoRequest'
      responses:
        '200':
          description: Instituicao atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instituicao'
        '400':
          description: Dados invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          description: Instituicao nao encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    delete:
      summary: Remover instituicao
      tags: [Instituicoes]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Removida com sucesso
        '404':
          description: Instituicao nao encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    DoacaoRequest:
      type: object
      required: [doador, item, quantidade, unidade, dataDoacao, instituicaoId]
      properties:
        doador:
          type: string
          example: Maria Silva
        item:
          type: string
          example: Arroz
        quantidade:
          type: number
          example: 10
        unidade:
          type: string
          example: kg
        dataDoacao:
          type: string
          format: date
          example: 2026-08-20
        instituicaoId:
          type: string
          description: Id de uma instituicao existente (colecao instituicoes).
          example: 665f1c2e9b1e8a3d4c5b6a7f
    StatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [PENDENTE, RECEBIDA, DISTRIBUIDA, CANCELADA]
    Doacao:
      allOf:
        - $ref: '#/components/schemas/DoacaoRequest'
        - type: object
          properties:
            id:
              type: string
            status:
              type: string
              enum: [PENDENTE, RECEBIDA, DISTRIBUIDA, CANCELADA]
    Endereco:
      type: object
      required: [rua, cidade, estado]
      properties:
        rua:
          type: string
          example: Rua A
        cidade:
          type: string
          example: Maringa
        estado:
          type: string
          example: PR
    Contato:
      type: object
      required: [nome]
      properties:
        nome:
          type: string
          example: Ana
        telefone:
          type: string
          example: "44999990000"
        email:
          type: string
          example: ana@ong.org
    InstituicaoRequest:
      type: object
      required: [nome, endereco]
      properties:
        nome:
          type: string
          example: Banco de Alimentos de Maringa
        endereco:
          $ref: '#/components/schemas/Endereco'
        contatos:
          type: array
          items:
            $ref: '#/components/schemas/Contato'
    Instituicao:
      allOf:
        - $ref: '#/components/schemas/InstituicaoRequest'
        - type: object
          properties:
            id:
              type: string
    Erro:
      type: object
      properties:
        erro:
          type: string
